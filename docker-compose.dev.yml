services:
  api:
    environment:
      ENVIRONMENT: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}"]
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
  db:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
